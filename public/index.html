<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- ── Primary Meta ──────────────────────────────────────────────────── -->
    <title>TechMart Network</title>
    <meta name="description" content="Electronics retail management — inventory, sales, transfers and reports across all branches." />
    <meta name="application-name" content="TechMart Network" />
    <meta name="author" content="TechMart" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- ── Theme colour (browser chrome & taskbar) ───────────────────────── -->
    <meta name="theme-color" content="#059669" />
    <meta name="theme-color" content="#0A1228" media="(prefers-color-scheme: dark)" />
    <meta name="background-color" content="#0A1228" />

    <!-- ── PWA Manifest ──────────────────────────────────────────────────── -->
    <link rel="manifest" href="/manifest.json" />

    <!-- ── Favicons ──────────────────────────────────────────────────────── -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="shortcut icon" href="/icons/favicon-32x32.png" />

    <!-- ── Apple / iOS PWA ───────────────────────────────────────────────── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TechMart" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144x144.png" />
    <link rel="apple-touch-icon" sizes="128x128" href="/icons/icon-128x128.png" />
    <link rel="apple-touch-icon" sizes="96x96"   href="/icons/icon-96x96.png" />
    <link rel="apple-touch-icon" sizes="72x72"   href="/icons/icon-72x72.png" />

    <!-- Apple splash screens (portrait) — covers common iPhone sizes -->
    <link rel="apple-touch-startup-image"
      media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)"
      href="/icons/icon-512x512.png" />
    <link rel="apple-touch-startup-image"
      media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)"
      href="/icons/icon-512x512.png" />
    <link rel="apple-touch-startup-image"
      media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
      href="/icons/icon-512x512.png" />
    <link rel="apple-touch-startup-image"
      media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)"
      href="/icons/icon-512x512.png" />
    <link rel="apple-touch-startup-image"
      media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)"
      href="/icons/icon-512x512.png" />
    <link rel="apple-touch-startup-image"
      media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)"
      href="/icons/icon-384x384.png" />

    <!-- ── Android / Windows ─────────────────────────────────────────────── -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-TileColor" content="#0A1228" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />
    <meta name="msapplication-config" content="none" />

    <!-- ── Open Graph (for sharing) ──────────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TechMart Network" />
    <meta property="og:description" content="Electronics retail management across all branches." />
    <meta property="og:image" content="/icons/icon-512x512.png" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run TechMart Network.</noscript>
    <div id="root"></div>
  </body>
</html>
